<div class="login-background min-vh-100 d-flex align-items-center justify-content-center position-relative">
  <div class="login-overlay"></div>
  <c-container>
    <c-row class="justify-content-center">
      <c-col sm="10" md="8" lg="5">
        <c-card class="login-card shadow-lg rounded-lg overflow-hidden">
          
          <!-- Header avec logo Onetech -->
          <c-card-header class="bg-transparent border-0 text-center py-4">
            <img src="assets/onetech_logo.jpg" alt="Onetech Tunisia" class="login-logo">
            <h2 class="mt-3 onetech-title">Système d'Inventaire</h2>
          </c-card-header>
          
          <!-- Body de la carte -->
          <c-card-body class="p-4 p-md-5">
            <div class="login-title-divider mb-4">
              <span>Connexion</span>
            </div>
            
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
              
              <!-- Username - Changed to regular input group -->
              <div class="input-group mb-4">
                <span class="input-group-text">
                  <i class="fas fa-user"></i>
                </span>
                <input
                  id="username"
                  formControlName="username"
                  type="text"
                  class="form-control form-control-lg"
                  placeholder="Nom d'utilisateur"
                />
              </div>
              
              <!-- Password - Changed to regular input group -->
              <div class="input-group mb-4">
                <span class="input-group-text">
                  <i class="fas fa-lock"></i>
                </span>
                <input
                  id="password"
                  formControlName="password"
                  type="password"
                  class="form-control form-control-lg"
                  placeholder="Mot de passe"
                />
              </div>
              
              <!-- Message d'erreur -->
              <div *ngIf="errorMessage" class="alert alert-danger small mb-4">
                <i class="fas fa-exclamation-triangle me-2"></i>
                {{ errorMessage }}
              </div>
              
              <!-- Bouton Login -->
              <div class="d-grid">
                <button
                  cButton
                  type="submit"
                  size="lg"
                  class="btn-login"
                >
                  <i class="fas fa-sign-in-alt me-2"></i>
                  Se connecter
                </button>
              </div>
              
              <!-- Footer avec copyright (maintenant dans c-card-body) -->
              <div class="text-center mt-4">
                <small class="text-muted">© 2025 OneTech Group - Système d'Inventaire</small>
              </div>
            </form>
          </c-card-body>
        </c-card>
      </c-col>
    </c-row>
  </c-container>
</div>
